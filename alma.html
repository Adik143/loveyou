<!DOCTYPE html>
<html lang="kk">
<head>
  <meta charset="UTF-8">
  <title>Айалаға арналған 💖</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      color: #fff;
      text-align: center;
    }

    h1 {
      margin-top: 100px;
      font-size: 26px;
      z-index: 2;
      position: relative;
    }

    #noBtn, #yesBtn {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      position: absolute;
      transition: 0.2s ease;
      z-index: 2;
    }

    #noBtn {
      background-color: #dc3545;
      color: white;
      left: 40%;
      top: 60%;
    }

    #yesBtn {
      background-color: #28a745;
      color: white;
      left: 45%;
      top: 60%;
      display: none;
    }

    #animation {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: black;
      z-index: 1;
    }

    .hearts {
      background: url('https://media.giphy.com/media/l4FGuhL4U2WyjdkaY/giphy.gif') center/cover no-repeat;
      width: 100%;
      height: 100%;
      opacity: 0.5;
      position: absolute;
      top: 0;
      left: 0;
    }

    .message {
      position: relative;
      top: 40%;
      z-index: 2;
    }

    .message h2 {
      font-size: 28px;
      color: #fff;
    }

    .map-link {
      font-size: 20px;
      color: #00e5ff;
      text-decoration: none;
    }

    .map-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <h1>Айала, менімен кездесуге қалай қарайсың? 💌</h1>

  <button id="noBtn">Жоқ</button>
  <button id="yesBtn">Иә</button>

  <div id="animation">
    <div class="hearts"></div>
    <div class="message">
      <h2>Мен келісемін ❤️</h2>
      <p>
        Кездесу орны 👉 <a class="map-link" href="https://go.2gis.com/GrecL" target="_blank">Мына жер</a>
      </p>
    </div>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const animation = document.getElementById('animation');

    let noMoves = 0;

    function moveNo() {
      const maxX = window.innerWidth - noBtn.offsetWidth;
      const maxY = window.innerHeight - noBtn.offsetHeight;
      const randX = Math.floor(Math.random() * maxX);
      const randY = Math.floor(Math.random() * maxY);

      noBtn.style.left = `${randX}px`;
      noBtn.style.top = `${randY}px`;

      noMoves++;
      if (noMoves >= 3) {
        yesBtn.style.display = "inline-block";
      }
    }

    noBtn.addEventListener('mouseenter', moveNo);
    noBtn.addEventListener('click', moveNo);

    yesBtn.addEventListener('click', () => {
      noBtn.style.display = 'none';
      yesBtn.style.display = 'none';
      document.querySelector('h1').style.display = 'none';
      animation.style.display = 'block';
    });
  </script>

</body>
</html>
